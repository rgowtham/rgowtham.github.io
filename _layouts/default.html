<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }} | {{ site.title }}</title>
    <link rel="stylesheet" href="{{ "/assets/css/style.css" | relative_url }}">
    <!-- MathJax for Math support in ML posts -->
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</head>
<body>
    <header>
        <div class="container">
            <h1><a href="{{ "/" | relative_url }}">{{ site.title }}</a></h1>
            <nav>
                <ul>
                    <li><a href="{{ "/" | relative_url }}">Portfolio</a></li>
                    <li><a href="{{ "/blog.html" | relative_url }}">Blog</a></li>
                    <li><a href="{{ "/about.html" | relative_url }}">About</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="container">
        {{ content }}
    </main>

    <footer>
        <div class="container">
            <p>&copy; {{ "now" | date: "%Y" }} {{ site.title }}. Powered by Jekyll.</p>
        </div>
    </footer>
</body>
</html>
